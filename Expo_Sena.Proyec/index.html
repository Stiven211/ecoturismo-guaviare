<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title> Turismo Guaviare </title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="arriba">
        <div class="botones2">
            <button id="btn-iniciar-sesion" class="login">Iniciar sesión</button>
            <button id="btn-perfil" class="perfil">Mi Perfil</button>
        </div>
        <div class="frase">
            <h1>Descubre el Guaviare <br>con guías locales</h1>
            <div class="botones">
                <button id="btn-guias" class="guias">Conocer Guías Locales</button>
            </div>
        </div>
    </div>


    <div class="medio">
        <h2 style="margin-left: 190px;">Destinos destacados</h2>
        <div class="destinos">
            <div class="pozos_naturales">
                <img src="img/Pozos Naturales.jpg" alt="Imagen de pozos naturales">
                <p><b>Pozos Naturales</b></p>
            </div>
            <div class="laguna_negra">
                <img src="img/laguna-negra.jpg" alt="Imagen laguna negra">
                <p><b>Laguna Negra</b></p>
            </div>
            <div class="puerta_de_orion">
                <img src="img/Puerta de orion.jpg" alt="Imagen de puerta de orion">
                <p><b>Puerta de orion</b></p>
            </div>
        </div>
    </div>


    <footer>
        <a href="http://"></a>
        <a href=""></a>
        <p class="info"></p>
        <p class="poolitica"></p>
    </footer>
    <script src="script.js"></script>
</body>

</html>
